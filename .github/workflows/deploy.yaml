name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd "${{ secrets.DEPLOY_DIR }}"

            # Sync code to the latest prod commit (keeps untracked .env/.venv).
            git fetch --all --prune
            git reset --hard origin/prod

            # Install locked deps into .venv (no dev tools in prod).
            uv sync --frozen --no-dev

            # Restart the service and show status.
            sudo systemctl restart yerzhanbot
            sudo systemctl --no-pager --full status yerzhanbot | head -n 20
