name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Push code into DEPLOY_DIR. --delete keeps it in sync; excluded paths
      # (.env, .venv, runtime dirs) are preserved on the server.
      - name: Rsync code to VPS
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude 'cobalt-keys.json' \
            --exclude '__pycache__' \
            --exclude 'logs' \
            --exclude 'src/logs' \
            --exclude 'yt_video' \
            --exclude 'audio' \
            --exclude 'test' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_DIR }}/"

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd "${{ secrets.DEPLOY_DIR }}"
            uv sync --frozen --no-dev
            sudo systemctl restart yerzhanbot
            sudo systemctl --no-pager --full status yerzhanbot | head -n 20
